<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CaloriesTracker</title>
    <base href="/calories-tracker/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CaloriesTracker.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-Q9Pm4WrlLfta2miKKtLn6oQq80ZVkjU",
            authDomain: "calories-tracker-3659f.firebaseapp.com",
            projectId: "calories-tracker-3659f",
            storageBucket: "calories-tracker-3659f.firebasestorage.app",
            messagingSenderId: "48036696900",
            appId: "1:48036696900:web:35675d27600693ca91fd11"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setPersistence(auth, browserLocalPersistence);

        window.firebaseInterop = {
            dotNetHelper: null,

            init: function (dotNetHelper) {
                this.dotNetHelper = dotNetHelper;
                onAuthStateChanged(auth, (user) => {
                    this.dotNetHelper.invokeMethodAsync(
                        'OnAuthStateChanged',
                        user ? user.uid : null,
                        user ? user.email : null
                    );
                });
            },

            signIn: async function (email, password) {
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    return { success: true, error: null };
                } catch (e) {
                    return { success: false, error: e.code };
                }
            },

            signUp: async function (email, password) {
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                    return { success: true, error: null };
                } catch (e) {
                    return { success: false, error: e.code };
                }
            },

            signOut: function () {
                return signOut(auth);
            },

            getUserData: async function (userId) {
                const docRef = doc(db, "users", userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    return docSnap.data();
                }
                return null;
            },

            setCalorieGoal: async function (userId, goal) {
                try {
                    const docRef = doc(db, "users", userId);
                    // setDoc with merge:true creates the doc if it doesn't exist,
                    // or updates just this field if it does — won't wipe other fields
                    await setDoc(docRef, { calorieGoal: goal }, { merge: true });
                    return { success: true, error: null };
                } catch (e) {
                    return { success: false, error: e.code };
                }
            },

            addMeal: async function (userId, date, mealName, calories, proteinGrams, carbsGrams, fatGrams, mealType, fullness) {
                try {
                    const mealsRef = collection(db, "users", userId, "meals");
                    const docRef = await addDoc(mealsRef, { date, mealName, calories, proteinGrams, carbsGrams, fatGrams, mealType, fullness });
                    return { success: true, id: docRef.id, error: null };
                } catch (e) {
                    return { success: false, id: null, error: e.code };
                }
            },

            getMeals: async function (userId) {
                try {
                    const mealsRef = collection(db, "users", userId, "meals");
                    const q = query(mealsRef, orderBy("date", "desc"));
                    const snapshot = await getDocs(q);
                    const meals = [];
                    snapshot.forEach((docSnap) => {
                        meals.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    return meals;
                } catch (e) {
                    console.error(e);
                    return [];
                }
            },

            updateMeal: async function (userId, mealId, date, mealName, calories, proteinGrams, carbsGrams, fatGrams, mealType, fullness) {
                try {
                    const mealRef = doc(db, "users", userId, "meals", mealId);
                    await updateDoc(mealRef, { date, mealName, calories, proteinGrams, carbsGrams, fatGrams, mealType, fullness });
                    return { success: true, error: null };
                } catch (e) {
                    return { success: false, error: e.code };
                }
            },

            deleteMeal: async function (userId, mealId) {
                try {
                    const mealRef = doc(db, "users", userId, "meals", mealId);
                    await deleteDoc(mealRef);
                    return { success: true, error: null };
                } catch (e) {
                    return { success: false, error: e.code };
                }
            },

            deleteAllMeals: async function (userId) {
                try {
                    const mealsRef = collection(db, "users", userId, "meals");
                    const snapshot = await getDocs(mealsRef);

                    if (snapshot.empty) {
                        return { success: true, error: null };
                    }

                    const docs = snapshot.docs;
                    const chunkSize = 500;

                    for (let i = 0; i < docs.length; i += chunkSize) {
                        const batch = writeBatch(db);
                        const chunk = docs.slice(i, i + chunkSize);
                        chunk.forEach((docSnap) => batch.delete(docSnap.ref));
                        await batch.commit();
                    }

                    return { success: true, error: null };
                } catch (e) {
                    return { success: false, error: e.code };
                }
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.scrollToElementWithOffset = (elementId, offset = 0) => {
            const el = document.getElementById(elementId);
            if (el) {
                const y = el.getBoundingClientRect().top + window.scrollY - offset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        };
    </script>
</body>

</html>
